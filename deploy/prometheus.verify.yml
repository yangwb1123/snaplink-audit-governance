global:
  scrape_interval: 5s
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: audit-api
    metrics_path: /metrics
    static_configs:
      - targets: [audit-api:8089]
  - job_name: audit-kafka-consumer
    metrics_path: /metrics
    static_configs:
      - targets: [audit-kafka-consumer:9092]
  - job_name: audit-kafka-dlq-replay
    metrics_path: /metrics
    static_configs:
      - targets: [audit-kafka-dlq-replay:9093]
