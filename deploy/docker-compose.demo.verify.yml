# Isolated, repeatable demo stack. This file is new and independent of
# deploy/docker-compose.verify.yml; nothing here is part of the production or
# release-verification path.
#
# The demo script always supplies a project name, a private env file outside
# the repository and random secrets. Never put real credentials in this file.
name: snaplink-audit-demo

x-demo-build: &demo-build
  context: ..
  dockerfile: Dockerfile

x-demo-image: &demo-image
  image: ${DEMO_IMAGE:-snaplink-audit-demo}:${DEMO_PROJECT:-snaplink-audit-demo}

# Shared non-secret API configuration. Secrets are required from the private
# env file generated by scripts/demo.sh; development auth and development
# secrets stay explicitly disabled. The local HS256 mode is the existing
# explicit isolated trust source (JWT secret + AUDIT_ALLOW_LOCAL_HS256=true).
x-demo-api-environment: &demo-api-environment
  AUDIT_LISTEN: ":8089"
  AUDIT_STATE_PATH: /var/lib/audit/state.json
  AUDIT_ARCHIVE_DIR: /var/lib/audit/archive
  AUDIT_BOOTSTRAP_TENANT: ${DEMO_TENANT:-demo}
  AUDIT_ALLOW_DEV_AUTH: "false"
  AUDIT_ALLOW_DEV_SECRETS: "false"
  AUDIT_ALLOW_LOCAL_HS256: "true"
  AUDIT_JWT_SECRET: ${DEMO_JWT_SECRET:?run make demo-up to create the private runtime file}
  AUDIT_JWT_ISSUER: ${DEMO_JWT_ISSUER:-snaplink-audit-demo}
  AUDIT_JWT_AUDIENCE: ${DEMO_JWT_AUDIENCE:-audit-governance}
  AUDIT_SIGNING_SECRET: ${DEMO_SIGNING_SECRET:?run make demo-up to create the private runtime file}
  AUDIT_ENCRYPTION_KEY: ${DEMO_ENCRYPTION_KEY:?run make demo-up to create the private runtime file}
  # One event per signed segment gives the demo a real checkpoint to verify
  # and to tamper with in the throwaway copy.
  AUDIT_SEGMENT_SIZE: "1"

services:
  # Core profile: one API process, real file state, local archive and the
  # API's built-in export queue. No PostgreSQL, Kafka, ClickHouse, IdP or
  # sibling repository is involved.
  audit-api-core:
    <<: *demo-image
    profiles: [core]
    build: *demo-build
    environment:
      <<: *demo-api-environment
    ports:
      - "127.0.0.1:${DEMO_API_PORT:-18089}:8089"
    volumes:
      - demo_core_state:/var/lib/audit
    networks: [demo]
    restart: "no"

  # Advanced profile: the existing PostgreSQL snapshot backend and the
  # governance worker. archive is MinIO with Object Lock + COMPLIANCE
  # retention bootstrapped by scripts/demo.sh before these services start.
  audit-api-advanced:
    <<: *demo-image
    profiles: [advanced]
    build: *demo-build
    environment:
      <<: *demo-api-environment
      AUDIT_POSTGRES_DSN: ${DEMO_POSTGRES_DSN:?run make demo-up to create the private runtime file}
      AUDIT_S3_ENDPOINT: ${DEMO_S3_ENDPOINT:-minio:9000}
      AUDIT_S3_BUCKET: ${DEMO_S3_BUCKET:-worm-audit}
      AUDIT_S3_ACCESS_KEY: ${DEMO_MINIO_USER:?run make demo-up to create the private runtime file}
      AUDIT_S3_SECRET_KEY: ${DEMO_MINIO_PASSWORD:?run make demo-up to create the private runtime file}
      AUDIT_S3_USE_SSL: "false"
      AUDIT_ARCHIVE_RETENTION_DAYS: "365"
    ports:
      - "127.0.0.1:${DEMO_API_PORT:-18089}:8089"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [demo]
    restart: "no"

  audit-governance-worker:
    <<: *demo-image
    profiles: [advanced]
    build: *demo-build
    entrypoint: ["/audit-governance-worker"]
    command: ["-interval", "5s"]
    environment:
      AUDIT_STATE_PATH: /var/lib/audit/state.json
      AUDIT_POSTGRES_DSN: ${DEMO_POSTGRES_DSN:?run make demo-up to create the private runtime file}
      AUDIT_ARCHIVE_DIR: /var/lib/audit/archive
      AUDIT_ALLOW_DEV_SECRETS: "false"
      AUDIT_SIGNING_SECRET: ${DEMO_SIGNING_SECRET:?run make demo-up to create the private runtime file}
      AUDIT_ENCRYPTION_KEY: ${DEMO_ENCRYPTION_KEY:?run make demo-up to create the private runtime file}
      AUDIT_S3_ENDPOINT: ${DEMO_S3_ENDPOINT:-minio:9000}
      AUDIT_S3_BUCKET: ${DEMO_S3_BUCKET:-worm-audit}
      AUDIT_S3_ACCESS_KEY: ${DEMO_MINIO_USER:?run make demo-up to create the private runtime file}
      AUDIT_S3_SECRET_KEY: ${DEMO_MINIO_PASSWORD:?run make demo-up to create the private runtime file}
      AUDIT_S3_USE_SSL: "false"
      AUDIT_ARCHIVE_RETENTION_DAYS: "365"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [demo]
    restart: "no"

  postgres:
    profiles: [advanced]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${DEMO_POSTGRES_PASSWORD:?run make demo-up to create the private runtime file}
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [demo]

  minio:
    profiles: [advanced]
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${DEMO_MINIO_USER:?run make demo-up to create the private runtime file}
      MINIO_ROOT_PASSWORD: ${DEMO_MINIO_PASSWORD:?run make demo-up to create the private runtime file}
    volumes:
      - demo_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc alias set health http://localhost:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1 && mc ready health"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [demo]

  # Tools profile: an own, disposable copy of the core volume. The helper
  # runs as root only inside this one-shot container so it can copy the
  # read-only source and hand the copy back to the unprivileged API user.
  # It never writes the source volume.
  demo-copy:
    <<: *demo-image
    profiles: [tools]
    build: *demo-build
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - demo_core_state:/source:ro
      - demo_tamper_state:/target
    networks: [demo]

  # Tools profile: a second API on the disposable copy only. It is never
  # started concurrently with audit-api-core, and it shares no state path,
  # volume or lock file with the original.
  audit-api-tamper:
    <<: *demo-image
    profiles: [tools]
    build: *demo-build
    environment:
      <<: *demo-api-environment
    ports:
      - "127.0.0.1:${DEMO_TAMPER_API_PORT:-18090}:8089"
    volumes:
      - demo_tamper_state:/var/lib/audit
    networks: [demo]
    restart: "no"

volumes:
  demo_core_state:
  demo_tamper_state:
  demo_postgres_data:
  demo_minio_data:

networks:
  demo:
