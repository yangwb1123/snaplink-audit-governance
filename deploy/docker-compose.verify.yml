name: snaplink-audit-verify

services:
  audit-api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      AUDIT_LISTEN: ":8089"
      AUDIT_STATE_PATH: /var/lib/audit/state.json
      AUDIT_ARCHIVE_DIR: /var/lib/audit/archive
      AUDIT_ALLOW_DEV_AUTH: "true"
      AUDIT_BOOTSTRAP_TENANT: demo
      AUDIT_SIGNING_SECRET: local-only-change-me
      AUDIT_ENCRYPTION_KEY: local-only-encryption-key
      AUDIT_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      - jaeger
    ports:
      - "19089:8089"
    volumes:
      - audit_state:/var/lib/audit
    networks: [audit_verify]

  audit-outbox-relay:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["/audit-outbox-relay"]
    command: ["-interval", "5s"]
    environment:
      AUDIT_OUTBOX_DSN: postgres://audit:audit-local-only@postgres:5432/audit?sslmode=disable
      AUDIT_OUTBOX_API_URL: http://audit-api:8089
      AUDIT_OUTBOX_TOKEN: dev:demo:service
      AUDIT_OUTBOX_INTERVAL: 5s
    depends_on:
      - postgres
      - audit-api
    restart: unless-stopped
    networks: [audit_verify]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit-local-only
    ports:
      - "19543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [audit_verify]

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.9
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks: [audit_verify]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: audit
      CLICKHOUSE_PASSWORD: audit-local-only
      CLICKHOUSE_DB: audit
    ports:
      - "19123:8123"
      - "19000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks: [audit_verify]

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: audit-local
      MINIO_ROOT_PASSWORD: audit-local-change-me
    ports:
      - "19010:9000"
      - "19011:9001"
    volumes:
      - minio_data:/data
    networks: [audit_verify]

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "19417:4317"
      - "19418:4318"
      - "19686:16686"
    networks: [audit_verify]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.verify.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "19090:9090"
    networks: [audit_verify]

volumes:
  audit_state:
  postgres_data:
  redpanda_data:
  clickhouse_data:
  minio_data:

networks:
  audit_verify:
    name: snaplink-audit-verify
