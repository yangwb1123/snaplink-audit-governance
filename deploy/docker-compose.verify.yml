name: snaplink-audit-verify

services:
  audit-api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      AUDIT_LISTEN: ":8089"
      AUDIT_GRPC_LISTEN: ":50051"
      AUDIT_STATE_PATH: /var/lib/audit/state.json
      AUDIT_POSTGRES_DSN: postgres://audit:audit-local-only@postgres:5432/audit?sslmode=disable
      # 验证栈明示：允许从残留文件状态切到 PostgreSQL 快照（防数据丢失保护
      # 的显式覆盖，仅限本机 verify 栈；生产切换必须走受控迁移）。
      AUDIT_ALLOW_PG_EMPTY_LEDGER: "true"
      AUDIT_ARCHIVE_DIR: /var/lib/audit/archive
      # G1 模式（AUDIT_IDP_* 配置存在时 fullstack.sh 注入 false + JWKS）：
      # 过渡期默认 true（dev token），IdP fixture 接入后显式 false。
      AUDIT_ALLOW_DEV_AUTH: ${AUDIT_ALLOW_DEV_AUTH:-true}
      AUDIT_JWKS_URL: ${AUDIT_JWKS_URL:-}
      AUDIT_JWT_ISSUER: ${AUDIT_JWT_ISSUER:-}
      AUDIT_ALLOW_INSECURE_JWKS_LOOPBACK: ${AUDIT_ALLOW_INSECURE_JWKS_LOOPBACK:-false}
      AUDIT_BOOTSTRAP_TENANT: demo
      AUDIT_SIGNING_SECRET: local-only-change-me
      AUDIT_ENCRYPTION_KEY: local-only-encryption-key
      AUDIT_OTLP_ENDPOINT: http://jaeger:4318
      AUDIT_S3_ENDPOINT: minio:9000
      AUDIT_S3_BUCKET: worm-audit
      AUDIT_S3_ACCESS_KEY: audit-local
      AUDIT_S3_SECRET_KEY: audit-local-change-me
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - jaeger
      - minio
    ports:
      - "19089:8089"
      - "19051:50051"
    volumes:
      - audit_state:/var/lib/audit
    networks: [audit_verify]

  audit-outbox-relay:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["/audit-outbox-relay"]
    command: ["-interval", "5s"]
    environment:
      AUDIT_OUTBOX_DSN: postgres://audit:audit-local-only@postgres:5432/audit?sslmode=disable
      AUDIT_OUTBOX_KAFKA_BROKERS: redpanda:9092
      AUDIT_OUTBOX_TOKEN: ${AUDIT_OUTBOX_TOKEN:-dev:demo:service}
      AUDIT_OUTBOX_INTERVAL: 5s
    depends_on:
      - postgres
      - redpanda
    restart: unless-stopped
    networks: [audit_verify]

  audit-kafka-consumer:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["/audit-kafka-consumer"]
    environment:
      AUDIT_KAFKA_BROKERS: redpanda:9092
      AUDIT_OUTBOX_API_URL: http://audit-api:8089
      # F3 传输门禁的显式放行（dev-only）：verify 栈内 audit-api 走容器网络
      # 明文 HTTP（http://audit-api:8089 非 loopback），ingest bearer token
      # 仅在本机隔离网络（audit_verify）内传输；二进制启动时非 loopback
      # 明文 http 默认失败关闭，生产环境必须使用 https，绝不设置此变量。
      AUDIT_ALLOW_INSECURE_API_URL: "true"
      AUDIT_OUTBOX_TOKEN: ${AUDIT_OUTBOX_TOKEN:-dev:demo:service}
      AUDIT_KAFKA_METRICS: ":9092"
    depends_on:
      - redpanda
      - audit-api
    restart: unless-stopped
    networks: [audit_verify]

  audit-kafka-dlq-replay:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["/audit-kafka-dlq-replay"]
    environment:
      AUDIT_KAFKA_BROKERS: redpanda:9092
      AUDIT_DLQ_REPLAY_STATE: /var/lib/audit/dlq-replay-state.json
      AUDIT_DLQ_REPLAY_METRICS: ":9093"
      # Kafka 重发模式（无 -api-url），不涉 F3 传输门禁。不带
      # -replay-auth-blocked（默认关）：error_code=unauthorized 的 DLQ 记录
      # 保持 auth-blocked（不重放、不提交、计入 audit_dlq_auth_blocked*），
      # 直到凭证修复后由排空流程显式启用该 flag。
    depends_on:
      - redpanda
    restart: unless-stopped
    volumes:
      - audit_state:/var/lib/audit
    networks: [audit_verify]

  audit-governance-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["/audit-governance-worker"]
    command: ["-interval", "5m"]
    environment:
      # 与 audit-api 共享控制面快照（PostgreSQL 单行 + 乐观锁，B1-2 多副本
      # 冲突重试的真实载体）；归档目标与签名/加密密钥必须与 audit-api 一致。
      AUDIT_POSTGRES_DSN: postgres://audit:audit-local-only@postgres:5432/audit?sslmode=disable
      AUDIT_ARCHIVE_DIR: /var/lib/audit/archive
      AUDIT_SIGNING_SECRET: local-only-change-me
      AUDIT_ENCRYPTION_KEY: local-only-encryption-key
      AUDIT_S3_ENDPOINT: minio:9000
      AUDIT_S3_BUCKET: worm-audit
      AUDIT_S3_ACCESS_KEY: audit-local
      AUDIT_S3_SECRET_KEY: audit-local-change-me
    # R-1（2026-08-15）：worker 启动即探测归档就绪（Ready），要求 bucket 存在、
    # Object Lock enabled + versioning，且默认留存为 COMPLIANCE + 正有效期。
    # worm-audit 的 COMPLIANCE 365d 默认留存由 test/e2e/fullstack.sh 在启动
    # 任何应用之前自举（mc retention set --default compliance 365d）并做
    # cutover 三态验证（no-default/GOVERNANCE → exit 1，COMPLIANCE → ok）。
    # 手工 `docker compose up -d` 时必须在启动本服务前完成同一自举，否则
    # worker 会 fatal 进入重启退避。
    depends_on:
      - postgres
      - minio
    restart: unless-stopped
    volumes:
      - audit_state:/var/lib/audit
    networks: [audit_verify]

  # G1 fixture: self-contained IdP for the real-token e2e (B1-7). Built from
  # the sibling snaplink checkout (../snaplink); its port is published so the
  # audit-api container reaches it via host.docker.internal (host-gateway)
  # and the host-side mint-token.sh reaches it via localhost.
  audit-idp:
    build:
      # 兄弟仓库 snaplink（sso-server）：deploy/ 上一级是仓库根，再上一级
      # 是 demo/ 工作区，snaplink 与其并列。
      context: ../../snaplink
      dockerfile: Dockerfile
    command: ["--config", "/etc/sso/idp.yaml"]
    volumes:
      - ./idp.verify.yaml:/etc/sso/idp.yaml:ro
    ports:
      - "18082:18082"
    networks: [audit_verify]

  audit-projector:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["/audit-projector"]
    environment:
      AUDIT_KAFKA_BROKERS: redpanda:9092
      AUDIT_CLICKHOUSE_DSN: clickhouse://audit:audit-local-only@clickhouse:9000/audit
    depends_on:
      - redpanda
      - clickhouse
    restart: unless-stopped
    networks: [audit_verify]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit-local-only
    ports:
      - "19543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [audit_verify]

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.9
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks: [audit_verify]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: audit
      CLICKHOUSE_PASSWORD: audit-local-only
      CLICKHOUSE_DB: audit
    ports:
      - "19123:8123"
      - "19000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks: [audit_verify]

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: audit-local
      MINIO_ROOT_PASSWORD: audit-local-change-me
    # WORM 桶自举（fullstack.sh 执行；mc 随镜像内置）：
    #   mc mb --with-lock worm-audit
    #   mc version enable worm-audit
    #   mc retention set --default compliance 365d worm-audit   # R-1 必需
    # 注意本镜像内置 mc 的 retention 子命令用位置参数模式
    # （`compliance` 而非 `--compliance`），`mc retention set --default
    # compliance 365d` 是已验证的正确写法。
    ports:
      - "19010:9000"
      - "19011:9001"
    volumes:
      - minio_data:/data
    networks: [audit_verify]

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "19417:4317"
      - "19418:4318"
      - "19686:16686"
    networks: [audit_verify]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.verify.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules.verify.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "19090:9090"
    networks: [audit_verify]

volumes:
  audit_state:
  postgres_data:
  redpanda_data:
  clickhouse_data:
  minio_data:

networks:
  audit_verify:
    name: snaplink-audit-verify
