groups:
  - name: audit-dlq
    rules:
      # DLQ 流量告警（release-notes 后续项）：任何新的死信发布都说明有事件
      # 无法进入账本，需要人工介入（重放、修 schema、换 token）。
      - alert: AuditDLQTraffic
        expr: increase(audit_consumer_dlq_published_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Audit events are being dead-lettered
          description: "{{ $value }} DLQ records published in the last 5 minutes by audit-kafka-consumer. Investigate error_code in audit.events.dlq.v1 and replay after fixing the cause."

      # 重放积压告警：DLQ 重放消费者发现未重放事件（重放失败或未调度）。
      - alert: AuditDLQBacklog
        expr: audit_dlq_pending > 0
        labels:
          severity: warning
        annotations:
          summary: Dead-letter backlog not draining
          description: "{{ $value }} dead-lettered events are pending replay. Check audit-kafka-dlq-replay state and the accepted-topic scan."

      # 重放失败告警：永久拒绝被标记为重放完成（不会自动重试），必须人工处理。
      - alert: AuditDLQRepublishFailures
        expr: increase(audit_dlq_republish_failures_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Dead-letter replay is failing
          description: "{{ $value }} replay republish failures in the last 15 minutes. Transient failures retry next round; permanent ones need operator action."

      # 不可解析丢弃告警：事件被判定为 unresolvable 并提交 DLQ offset 后永久丢弃
      # （accepted topic 保留期过期或 topic 重建导致原事件不存在）。这是账本证据的
      # 永久丢失信号，必须人工确认 retention / 重建事件。
      - alert: AuditDLQUnresolvableDrop
        expr: increase(audit_dlq_unresolvable_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Dead-lettered events dropped as unresolvable (permanent loss)
          description: "{{ $value }} dead-lettered events were resolved as unresolvable in the last 15m (original not found in the accepted topic) and their DLQ offsets were committed. This is a permanent loss of ledger evidence; check accepted-topic retention and topic recreation."

      # 认证死信告警（consumer 侧计数器）：新的 401 类死信说明接入凭证为空/被拒
      # （或 IdP/JWKS 故障），事件正在被死信为 error_code=unauthorized，且重放器
      # 默认不触碰它们（-replay-auth-blocked 默认关）。依赖 audit-kafka-consumer
      # /metrics（AUDIT_KAFKA_METRICS，默认关闭；未启用时本规则静默）。
      - alert: AuditDLQAuthBlocked
        expr: increase(audit_consumer_unauthorized_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Audit ingest token rejected (401) — dead-letters classified unauthorized
          description: "{{ $value }} dead-lettered events classified as unauthorized in the last 15m. Restore/rotate AUDIT_OUTBOX_TOKEN (or fix the IdP/JWKS outage); records stay auth-blocked in the DLQ until the credential works and replay is re-enabled (-replay-auth-blocked)."

      # 认证阻塞积压告警（replay 侧 gauge）：任何 error_code=unauthorized 记录被
      # 重放器保持 auth-blocked（不重放、不提交）期间持续触发——覆盖静止积压
      # （audit_dlq_pending 不含阻塞记录，AuditDLQBacklog 看不到它）与伪造阻塞楔子。
      # 依赖 audit-kafka-dlq-replay /metrics（AUDIT_DLQ_REPLAY_METRICS，默认关闭；
      # -once 模式不挂载 /metrics）。积压排空后 gauge 归零，规则自动清除。
      - alert: AuditDLQAuthBlockedBacklog
        expr: audit_dlq_auth_blocked > 0
        labels:
          severity: warning
        annotations:
          summary: Auth-blocked DLQ backlog not draining
          description: "{{ $value }} dead-lettered records are held auth-blocked (error_code=unauthorized). Verify the ingest credential (token problem vs IdP/JWKS outage) and that blocked events have accepted-topic originals, then drain with -replay-auth-blocked; the gauge falls to 0 when drained."

  - name: audit-slo
    # docs/SLO_ALERTS.md §2 告警规则 → audit-api /metrics 指标。
    # 完整性与签名失败独立于错误预算（安全事件）。
    rules:
      - alert: AuditIngestErrorRate
        expr: rate(audit_http_errors_total[5m]) / rate(audit_http_requests_total[5m]) > 0.01
        labels:
          severity: page
        annotations:
          summary: Audit ingest error rate above SLO budget
          description: "Ingest 5xx/error rate {{ $value }} > 1% over 5m. Check ingest and storage dependencies (SLO 99.99% / month)."

      - alert: AuditDuplicateStorm
        expr: increase(audit_ingest_duplicates_total[5m]) > 10 * increase(audit_ingest_requests_total[5m])
        labels:
          severity: warning
        annotations:
          summary: Duplicate ingest storm
          description: "Duplicate hits exceed 10x request volume over 5m. Check source-system retry storms."

      - alert: AuditContentConflict
        expr: increase(audit_ingest_conflicts_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Event content conflicts detected
          description: "{{ $value }} event_id content conflicts (or idempotency-key reuse) in 5m. Suspected replay or faulty re-send; investigate the producer."

      - alert: AuditQuotaExceeded
        expr: increase(audit_ingest_quota_exceeded_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Tenant write quota exceeded
          description: "{{ $value }} quota rejections (429) in 5m. Notify the tenant and review per-tenant QPS/burst limits."

      - alert: AuditIntegrityInvalid
        expr: audit_integrity_checks_total{result="invalid"} > 0
        labels:
          severity: critical
        annotations:
          summary: Integrity verification failed
          description: "A chain/segment/content verification failed. Isolate the evidence chain immediately and investigate manually (P0, outside error budget)."

      - alert: AuditLatencyDegradation
        expr: histogram_quantile(0.99, rate(audit_http_request_duration_seconds_bucket[5m])) > 1
        labels:
          severity: warning
        annotations:
          summary: Audit API latency degraded
          description: "p99 request latency {{ $value }}s > 1s over 5m. Check resources and backpressure."

      - alert: AuditAPIDown
        expr: up{job="audit-api"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: Audit API unreachable
          description: "audit-api /metrics scrape failing for 2m. readyz 503 (store_unavailable / archive_unavailable) precedes this when the PostgreSQL snapshot backend or the WORM destination is down; production should probe /readyz via a blackbox exporter."

  - name: audit-production
    # 需要生产形态指标/日志，本机参考实现不提供（见 VALIDATION_PLAN
    # 「不在本机宣称通过的项目」）；声明规则以便生产接入时直接生效。
    rules:
      - alert: AuditConsumerLag
        expr: kafka_consumer_lag > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Kafka consumer lag growing
          description: "Consumer lag has been non-zero for 10m. Scale consumers/projector or investigate blocked partitions."

      - alert: AuditSigningFailure
        expr: audit_worker_sign_errors_total > 0
        labels:
          severity: critical
        annotations:
          summary: Checkpoint signing failing
          description: "Aggregate/segment checkpoint signing failures (KMS/Vault/HSM unavailable). Stop generating new checkpoints; do not fake archive success."
