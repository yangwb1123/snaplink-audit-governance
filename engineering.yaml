# Declarative quality-gate thresholds, following the sibling Snaplink
# engineering harness convention. The CLI intentionally uses only this small
# dependency-free subset so checks work in a clean Go checkout.
project:
  name: snaplink-audit-governance
  module: github.com/snaplink/audit-governance
  language: go

quality:
  max_go_lines: 1500
  max_function_lines: 260
  max_decisions: 45

build:
  output_dir: bin
  binaries:
    - name: audit-api
      path: ./cmd/audit-api
    - name: audit-governance-worker
      path: ./cmd/audit-governance-worker
    - name: audit-outbox-relay
      path: ./cmd/audit-outbox-relay
    - name: audit-kafka-consumer
      path: ./cmd/audit-kafka-consumer
    - name: audit-kafka-dlq-replay
      path: ./cmd/audit-kafka-dlq-replay
    - name: audit-projector
      path: ./cmd/audit-projector

# Single source of truth for the api/proto generator toolchain pins.
# checks/proto_sync.py and scripts/proto-gen.py read only this block;
# the checked-in generated headers (api/proto/*.pb.go) must match these
# pins, and the protoc-gen-go pin must equal the google.golang.org/protobuf
# version in go.mod (enforced by the quality gate).
proto:
  protoc: v3.21.12
  protoc-gen-go: v1.36.11
  protoc-gen-go-grpc: v1.5.1
