# Declarative quality-gate thresholds, following the sibling Snaplink
# engineering harness convention. The CLI intentionally uses only this small
# dependency-free subset so checks work in a clean Go checkout.
project:
  name: snaplink-audit-governance
  module: github.com/snaplink/audit-governance
  language: go

quality:
  max_go_lines: 1500
  # Function budgets are measured by checks/complexity.py: a function body ends
  # at the closing brace in column 0, and comment/blank lines and branch
  # keywords inside string literals do not count. The previous measurement
  # ended a function at the next `func` header, so trailing type declarations
  # and doc comments were charged to it and no real function could be measured
  # (repository maximum was 19 branches against a 45 budget).
  #
  # These values come from the corrected metric over 1036 production
  # functions: worst length 189 (Service.Ingest, internal/service/service.go),
  # worst decisions 53 (Service.Ingest) and 47 (Service.VerifyIntegrity,
  # internal/service/governance.go). The budgets sit just above those two
  # outliers and must be lowered as they are split — the next function added
  # to the ingest or integrity path has to be smaller than the one it joins.
  max_function_lines: 220
  max_decisions: 55

build:
  output_dir: bin
  binaries:
    - name: audit-api
      path: ./cmd/audit-api
    - name: audit-governance-worker
      path: ./cmd/audit-governance-worker
    - name: audit-outbox-relay
      path: ./cmd/audit-outbox-relay
    - name: audit-kafka-consumer
      path: ./cmd/audit-kafka-consumer
    - name: audit-kafka-dlq-replay
      path: ./cmd/audit-kafka-dlq-replay
    - name: audit-projector
      path: ./cmd/audit-projector
    - name: audit-pg-migrate
      path: ./cmd/audit-pg-migrate

# Single source of truth for the api/proto generator toolchain pins.
# checks/proto_sync.py and scripts/proto-gen.py read only this block;
# the checked-in generated headers (api/proto/*.pb.go) must match these
# pins, and the protoc-gen-go pin must equal the google.golang.org/protobuf
# version in go.mod (enforced by the quality gate).
proto:
  protoc: v3.21.12
  protoc-gen-go: v1.36.11
  protoc-gen-go-grpc: v1.5.1
