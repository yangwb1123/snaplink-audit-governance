openapi: 3.1.0
info:
  title: Snaplink Audit Governance API
  version: 0.1.0
  description: Multi-tenant audit ingestion, immutable ledger and governance API.
servers:
  - url: http://localhost:8089
security:
  - bearerAuth: []
paths:
  /api/v1/compat/snaplink/audit/events:
    get:
      operationId: querySnaplinkConsoleAuditEvents
      description: 'Tenant scope: approved all-tenant Console read; omitted or empty tenant_id means all tenants, while a supplied filter narrows the result and signed tenant claims remain authoritative.'
      x-tenant-scope: { policy: all-tenants, selector: optional-query-filter, platform_selector_required: false, tenant_token_source: signed-claim, empty_platform_behavior: all-tenants }
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: event_type, in: query, schema: { type: string } }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: client_id, in: query, description: Trusted source_system filter, schema: { type: string } }
        - { $ref: '#/components/parameters/tenantId' }
        - { name: outcome, in: query, schema: { type: string } }
        - { name: trace_id, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { oneOf: [{ type: string, format: date-time }, { type: integer, format: int64 }] } }
        - { name: until, in: query, schema: { oneOf: [{ type: string, format: date-time }, { type: integer, format: int64 }] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        '200': { description: Newest-first Console event page, content: { application/json: { schema: { $ref: '#/components/schemas/AuditExplorerResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/compat/snaplink/audit/events/{eventId}:
    get:
      operationId: getSnaplinkConsoleAuditEvent
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ $ref: '#/components/parameters/eventId' }, { $ref: '#/components/parameters/tenantId' }]
      responses:
        '200': { description: Canonical governance event, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/compat/snaplink/audit/facets:
    get:
      operationId: querySnaplinkConsoleAuditFacets
      description: 'Tenant scope: approved all-tenant Console read; omitted or empty tenant_id means all tenants, while a supplied filter narrows the result and signed tenant claims remain authoritative.'
      x-tenant-scope: { policy: all-tenants, selector: optional-query-filter, platform_selector_required: false, tenant_token_source: signed-claim, empty_platform_behavior: all-tenants }
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: event_type, in: query, schema: { type: string } }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: client_id, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/tenantId' }
        - { name: outcome, in: query, schema: { type: string } }
        - { name: trace_id, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { oneOf: [{ type: string, format: date-time }, { type: integer, format: int64 }] } }
        - { name: until, in: query, schema: { oneOf: [{ type: string, format: date-time }, { type: integer, format: int64 }] } }
      responses:
        '200': { description: Facet counts, content: { application/json: { schema: { type: object, required: [facets], properties: { facets: { $ref: '#/components/schemas/EventFacets' } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/events:
    post:
      operationId: writeEvent
      x-tenant-scope: { policy: scoped, selector: body, selector_path: tenant_id, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      description: 'Tenant scope: body-selected write; platform credentials must provide a non-empty Event.tenant_id; tenant credentials use the signed tenant and reject a mismatch. The server derives OAuth client identity from signed client_id (or compatible azp). When no tenant claim exists, tenant_id is uniquely resolved from server-side (client_id, source_system) registration. A non-empty body stream_id is stripped on ingest; the server derives the stream from tenant + aggregate/operation/source and stamps it. stream_id is a read/query filter only. sub is never used as client identity. Runtime caps are authoritative: applicable persisted strings are limited to 8192 UTF-8 bytes, not characters.'
      parameters:
        - { name: wait_for, in: query, schema: { type: string, enum: [accepted, ledgered, indexed, archived] } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/ReceiptResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error', description: 'Envelope tenant_id does not match the resolved tenant, schema not found, or occurred_at outside [1900-01-01T00:00:00Z, 2299-12-31T23:59:59.999Z] (422 occurred_at_out_of_range)' }
    get:
      operationId: queryEvents
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected. Items are ordered by (occurred_at, sequence, event_id). next_cursor resumes at exactly that position; a page walk reproduces the unpaginated result with no duplicates and no drops. Cursors issued before chronological ordering are rejected with 400; re-run the query to obtain a fresh cursor. Archived events are read from the configured WORM archive and remain visible after hot-payload eviction.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters:
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - { $ref: '#/components/parameters/tenantId' }
        - { name: event_type, in: query, schema: { type: string } }
        - { name: source_system, in: query, schema: { type: string } }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: target_id, in: query, schema: { type: string } }
        - { name: operation_id, in: query, schema: { type: string } }
        - { name: causation_id, in: query, schema: { type: string } }
        - { name: correlation_id, in: query, schema: { type: string } }
        - { name: aggregate_type, in: query, schema: { type: string } }
        - { name: aggregate_id, in: query, schema: { type: string } }
        - { name: trace_id, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string } }
        - { name: payload_field, in: query, schema: { type: string } }
        - { name: payload_digest, in: query, schema: { type: string } }
        - { name: stream_id, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: page_size, in: query, schema: { type: integer, maximum: 1000, default: 100 } }
      responses:
        '200': { description: Event page, content: { application/json: { schema: { $ref: '#/components/schemas/QueryResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/events/{eventId}:
    get:
      operationId: getEvent
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected. Archived event payloads are read from the configured WORM archive and verified against the retained receipt hash before being returned.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ $ref: '#/components/parameters/eventId' }, { $ref: '#/components/parameters/tenantId' }]
      responses: { '200': { description: Event, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }, '404': { $ref: '#/components/responses/Error' }, '500': { $ref: '#/components/responses/Error' } }
  /api/v1/events/{eventId}/receipt:
    get:
      operationId: getReceipt
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ $ref: '#/components/parameters/eventId' }, { $ref: '#/components/parameters/tenantId' }]
      responses: { '200': { description: Receipt, content: { application/json: { schema: { $ref: '#/components/schemas/Receipt' } } } } }
  /api/v1/events:batch:
    post:
      operationId: writeBatch
      description: 'Tenant scope: body-selected write; every platform batch member must provide a non-empty Event.tenant_id, tenant credentials use the signed tenant, and selector failures are rejected before any member is ingested.'
      x-tenant-scope: { policy: scoped, selector: body, selector_path: 'events[*].tenant_id', platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [events], properties: { events: { type: array, maxItems: 500, description: 'An over-count batch is rejected before any member is ingested.', items: { $ref: '#/components/schemas/Event' } }, wait_for: { type: string } } } } } }
      responses: { '202': { description: Accepted batch }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error', description: 'Envelope tenant_id does not match the resolved tenant, schema not found, or occurred_at outside [1900-01-01T00:00:00Z, 2299-12-31T23:59:59.999Z] (422 occurred_at_out_of_range)' } }
  /api/v1/operations/{operationId}:
    get:
      operationId: getOperation
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ $ref: '#/components/parameters/operationId' }, { $ref: '#/components/parameters/tenantId' }]
      responses: { '200': { description: Operation summary } }
  /api/v1/operations/{operationId}/timeline:
    get:
      operationId: getOperationTimeline
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected. Items are ordered by (occurred_at, sequence, event_id); next_cursor is bound to this operation and resumes after the last item; count is the total matching event count.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters:
        - { $ref: '#/components/parameters/operationId' }
        - { $ref: '#/components/parameters/tenantId' }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: page_size, in: query, schema: { type: integer, maximum: 1000, default: 100 } }
      responses: { '200': { description: Operation timeline page, content: { application/json: { schema: { $ref: '#/components/schemas/QueryResult' } } } }, '400': { $ref: '#/components/responses/Error' }, '500': { $ref: '#/components/responses/Error' } }
  /api/v1/operations/{operationId}/replay:
    get:
      operationId: replayOperation
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ $ref: '#/components/parameters/operationId' }, { $ref: '#/components/parameters/tenantId' }]
      responses: { '200': { description: Side-effect-free replay } }
  /api/v1/aggregates/{aggregateType}/{aggregateId}/timeline:
    get:
      operationId: getAggregateTimeline
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected. Items are ordered by (aggregate_version, event_id); next_cursor is bound to this operation and resumes after the last item; count is the total matching event count.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters:
        - { name: aggregateType, in: path, required: true, schema: { type: string } }
        - { name: aggregateId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/tenantId' }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: page_size, in: query, schema: { type: integer, maximum: 1000, default: 100 } }
      responses: { '200': { description: Aggregate history page, content: { application/json: { schema: { $ref: '#/components/schemas/QueryResult' } } } }, '400': { $ref: '#/components/responses/Error' }, '500': { $ref: '#/components/responses/Error' } }
  /api/v1/exports:
    post:
      operationId: createExport
      description: 'Tenant scope: scoped write; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected before an export job or audit fact is created.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ $ref: '#/components/parameters/tenantId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Query' } } } }
      responses: { '202': { description: Export job }, '400': { $ref: '#/components/responses/Error' } }
  /api/v1/exports/{jobId}:
    get:
      operationId: getExport
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/tenantId' }]
      responses: { '200': { description: Export status } }
  /api/v1/exports/{jobId}/download:
    get:
      operationId: downloadExport
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected before export bytes are read.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/tenantId' }]
      responses:
        '200': { description: Export JSON Lines download, content: { application/x-ndjson: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/integrity/verify:
    post:
      operationId: verifyIntegrity
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected before integrity work or its audit fact.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ $ref: '#/components/parameters/tenantId' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { stream_id: { type: string } } } } } }
      responses: { '200': { description: Integrity result }, '400': { $ref: '#/components/responses/Error' } }
  /api/v1/legal-holds:
    post:
      operationId: createLegalHold
      description: 'Tenant scope: scoped write; the tenant_id query selector is authoritative for platform credentials, an optional body tenant_id is consistency-only, and omitted or empty platform scope is rejected.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ $ref: '#/components/parameters/tenantId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LegalHold' } } } }
      responses: { '201': { description: Legal hold }, '400': { $ref: '#/components/responses/Error' } }
    get:
      operationId: listLegalHolds
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ $ref: '#/components/parameters/tenantId' }]
      responses: { '200': { description: Legal holds } }
  /api/v1/legal-holds/{holdId}/release:
    post:
      operationId: releaseLegalHold
      description: 'Tenant scope: scoped write; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ name: holdId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/tenantId' }]
      responses: { '200': { description: Released legal hold } }
  /api/v1/restores/preview:
    post:
      operationId: previewRestore
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected before restore preview.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ $ref: '#/components/parameters/tenantId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RestoreRequest' } } } }
      responses: { '200': { description: Restore preview }, '400': { $ref: '#/components/responses/Error' } }
  /api/v1/restores:
    post:
      operationId: createRestore
      description: 'Tenant scope: scoped write; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected before a restore run is created.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ $ref: '#/components/parameters/tenantId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RestoreRequest' } } } }
      responses: { '202': { description: Pending approval restore run }, '400': { $ref: '#/components/responses/Error' } }
  /api/v1/restores/{runId}:
    get:
      operationId: getRestore
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ name: runId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/tenantId' }]
      responses: { '200': { description: Restore run } }
  /api/v1/restores/{runId}/approve:
    post:
      operationId: approveRestore
      description: 'Tenant scope: scoped write; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected. The approval decision is recorded without executing business calls.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ name: runId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/tenantId' }]
      responses:
        '200': { description: Approved restore run }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/restores/{runId}/reject:
    post:
      operationId: rejectRestore
      description: 'Tenant scope: scoped write; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ name: runId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/tenantId' }]
      responses:
        '200': { description: Rejected restore run }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/admin/actions:
    get:
      operationId: listAdminActions
      description: 'Tenant scope: approved all-tenant platform or tenantless Console read; omitted or empty tenant_id means all tenants, while a supplied filter narrows the result and signed tenant claims remain authoritative.'
      x-tenant-scope: { policy: all-tenants, selector: optional-query-filter, platform_selector_required: false, tenant_token_source: signed-claim, empty_platform_behavior: all-tenants }
      parameters:
        - { $ref: '#/components/parameters/tenantId' }
        - { name: limit, in: query, required: false, schema: { type: integer, maximum: 100, default: 100 } }
      responses:
        '200': { description: Admin actions, content: { application/json: { schema: { $ref: '#/components/schemas/AdminAction' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/tenants:
    post:
      operationId: createTenant
      description: 'Platform management: Tenant.id is the new resource identity, not an implicit tenant scope selector.'
      x-platform-management: { enabled: true }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } } }
      responses: { '201': { description: Tenant }, '400': { $ref: '#/components/responses/Error' } }
    get:
      operationId: listTenants
      description: 'Platform management: this explicitly lists tenants and has no tenant_id scope selector.'
      x-platform-management: { enabled: true }
      responses: { '200': { description: Tenants } }
  /api/v1/sources:
    post:
      operationId: createSource
      description: 'Tenant scope: scoped write; the tenant_id query selector is authoritative for platform credentials, an optional body tenant_id is consistency-only, and omitted or empty platform scope is rejected.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ $ref: '#/components/parameters/tenantId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Source' } } } }
      responses: { '201': { description: Source system }, '400': { $ref: '#/components/responses/Error' } }
    get:
      operationId: listSources
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters:
        - { $ref: '#/components/parameters/tenantId' }
      responses: { '200': { description: Source systems } }
  /api/v1/sources/{sourceId}:
    put:
      operationId: updateSource
      description: 'Tenant scope: scoped write; tenant_id in the query selects the source tenant for platform credentials, body tenant_id is consistency-only, and omitted or empty platform scope is rejected.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters:
        - { name: sourceId, in: path, required: true, schema: { type: string } }
