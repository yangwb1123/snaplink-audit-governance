openapi: 3.1.0
x-contract-version: 1
info:
  title: Snaplink Audit Governance API
  version: 0.1.0
  description: Multi-tenant audit ingestion, immutable ledger and governance API.
servers:
  - url: http://localhost:8089
security:
  - bearerAuth: []
paths:
  /api/v1/compat/snaplink/audit/events:
    get:
      operationId: querySnaplinkConsoleAuditEvents
      x-runtime-handler: querySnaplinkAuditEvents
      x-required-permission: audit:event:read
      x-allow-tenantless-console: true
      x-error-mappings: [{ code: invalid_request, status: 400 }, { code: unauthorized, status: 401 }, { code: forbidden, status: 403 }, { code: not_found, status: 404 }, { code: conflict, status: 409 }, { code: occurred_at_out_of_range, status: 422 }, { code: schema_not_found, status: 422 }, { code: tenant_mismatch, status: 422 }, { code: quota_exceeded, status: 429 }, { code: internal_error, status: 500 }, { code: snapshot_conflict, status: 503 }]
      description: 'Tenant scope: approved all-tenant Console read; omitted or empty tenant_id means all tenants, while a supplied filter narrows the result and signed tenant claims remain authoritative.'
      x-tenant-scope: { policy: all-tenants, selector: optional-query-filter, platform_selector_required: false, tenant_token_source: signed-claim, empty_platform_behavior: all-tenants }
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: event_type, in: query, schema: { type: string } }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: client_id, in: query, description: 'Trusted source_system filter', schema: { type: string } }
        - { $ref: '#/components/parameters/tenantId' }
        - { name: outcome, in: query, schema: { type: string } }
        - { name: trace_id, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { oneOf: [{ type: string, format: date-time }, { type: integer, format: int64 }] } }
        - { name: until, in: query, schema: { oneOf: [{ type: string, format: date-time }, { type: integer, format: int64 }] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        '200': { description: 'Newest-first Console event page', content: { application/json: { schema: { $ref: '#/components/schemas/AuditExplorerResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/compat/snaplink/audit/events/{eventId}:
    get:
      operationId: getSnaplinkConsoleAuditEvent
      x-runtime-handler: getEvent
      x-required-permission: audit:event:read
      x-error-mappings: [{ code: invalid_request, status: 400 }, { code: unauthorized, status: 401 }, { code: forbidden, status: 403 }, { code: not_found, status: 404 }, { code: conflict, status: 409 }, { code: occurred_at_out_of_range, status: 422 }, { code: schema_not_found, status: 422 }, { code: tenant_mismatch, status: 422 }, { code: quota_exceeded, status: 429 }, { code: internal_error, status: 500 }, { code: snapshot_conflict, status: 503 }]
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ $ref: '#/components/parameters/eventId' }, { $ref: '#/components/parameters/tenantId' }]
      responses:
        '200': { description: 'Canonical governance event', content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/compat/snaplink/audit/facets:
    get:
      operationId: querySnaplinkConsoleAuditFacets
      x-runtime-handler: querySnaplinkAuditFacets
      x-required-permission: audit:event:read
      x-allow-tenantless-console: true
      x-error-mappings: [{ code: invalid_request, status: 400 }, { code: unauthorized, status: 401 }, { code: forbidden, status: 403 }, { code: not_found, status: 404 }, { code: conflict, status: 409 }, { code: occurred_at_out_of_range, status: 422 }, { code: schema_not_found, status: 422 }, { code: tenant_mismatch, status: 422 }, { code: quota_exceeded, status: 429 }, { code: internal_error, status: 500 }, { code: snapshot_conflict, status: 503 }]
      description: 'Tenant scope: approved all-tenant Console read; omitted or empty tenant_id means all tenants, while a supplied filter narrows the result and signed tenant claims remain authoritative.'
      x-tenant-scope: { policy: all-tenants, selector: optional-query-filter, platform_selector_required: false, tenant_token_source: signed-claim, empty_platform_behavior: all-tenants }
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: event_type, in: query, schema: { type: string } }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: client_id, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/tenantId' }
        - { name: outcome, in: query, schema: { type: string } }
        - { name: trace_id, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { oneOf: [{ type: string, format: date-time }, { type: integer, format: int64 }] } }
        - { name: until, in: query, schema: { oneOf: [{ type: string, format: date-time }, { type: integer, format: int64 }] } }
      responses:
        '200': { description: 'Facet counts', content: { application/json: { schema: { $ref: '#/components/schemas/EventFacetsResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/events:
    post:
      operationId: writeEvent
      x-runtime-handler: postEvent
      x-required-permission: audit:event:write
      x-error-mappings: [{ code: invalid_request, status: 400 }, { code: unauthorized, status: 401 }, { code: forbidden, status: 403 }, { code: not_found, status: 404 }, { code: conflict, status: 409 }, { code: occurred_at_out_of_range, status: 422 }, { code: schema_not_found, status: 422 }, { code: tenant_mismatch, status: 422 }, { code: quota_exceeded, status: 429 }, { code: internal_error, status: 500 }, { code: snapshot_conflict, status: 503 }]
      x-tenant-scope: { policy: scoped, selector: body, selector_path: tenant_id, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      description: 'Tenant scope: body-selected write; platform credentials must provide a non-empty Event.tenant_id; tenant credentials use the signed tenant and reject a mismatch. The server derives OAuth client identity from signed client_id (or compatible azp). When no tenant claim exists, tenant_id is uniquely resolved from server-side (client_id, source_system) registration. A non-empty body stream_id is stripped on ingest; the server derives the stream from tenant + aggregate/operation/source and stamps it. stream_id is a read/query filter only. sub is never used as client identity. Runtime caps are authoritative: applicable persisted strings are limited to 8192 UTF-8 bytes, not characters.'
      parameters:
        - { name: wait_for, in: query, schema: { type: string, enum: [accepted, ledgered, indexed, archived] } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EventInput' } } } }
      responses:
        '202': { description: 'Accepted', content: { application/json: { schema: { $ref: '#/components/schemas/ReceiptResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error', description: 'Envelope validation failure; 422 occurred_at_out_of_range is returned when occurred_at is outside the supported ledger horizon.' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    get:
      operationId: queryEvents
      x-runtime-handler: queryEvents
      x-required-permission: audit:event:read
      x-error-mappings: [{ code: invalid_request, status: 400 }, { code: unauthorized, status: 401 }, { code: forbidden, status: 403 }, { code: not_found, status: 404 }, { code: conflict, status: 409 }, { code: occurred_at_out_of_range, status: 422 }, { code: schema_not_found, status: 422 }, { code: tenant_mismatch, status: 422 }, { code: quota_exceeded, status: 429 }, { code: internal_error, status: 500 }, { code: snapshot_conflict, status: 503 }]
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected. Items are ordered by (occurred_at, sequence, event_id). next_cursor resumes at exactly that position; a page walk reproduces the unpaginated result with no duplicates and no drops. Cursors issued before chronological ordering are rejected with 400; re-run the query to obtain a fresh cursor. Archived events are read from the configured WORM archive and remain visible after hot-payload eviction.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters:
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - { $ref: '#/components/parameters/tenantId' }
        - { name: event_type, in: query, schema: { type: string } }
        - { name: source_system, in: query, schema: { type: string } }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: target_id, in: query, schema: { type: string } }
        - { name: operation_id, in: query, schema: { type: string } }
        - { name: causation_id, in: query, schema: { type: string } }
        - { name: correlation_id, in: query, schema: { type: string } }
        - { name: aggregate_type, in: query, schema: { type: string } }
        - { name: aggregate_id, in: query, schema: { type: string } }
        - { name: trace_id, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string } }
        - { name: payload_field, in: query, schema: { type: string } }
        - { name: payload_digest, in: query, schema: { type: string } }
        - { name: stream_id, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: page_size, in: query, schema: { type: integer, maximum: 1000, default: 100 } }
      responses:
        '200': { description: 'Event page', content: { application/json: { schema: { $ref: '#/components/schemas/QueryResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/events/{eventId}:
    get:
      operationId: getEvent
      x-runtime-handler: getEvent
      x-required-permission: audit:event:read
      x-error-mappings: [{ code: invalid_request, status: 400 }, { code: unauthorized, status: 401 }, { code: forbidden, status: 403 }, { code: not_found, status: 404 }, { code: conflict, status: 409 }, { code: occurred_at_out_of_range, status: 422 }, { code: schema_not_found, status: 422 }, { code: tenant_mismatch, status: 422 }, { code: quota_exceeded, status: 429 }, { code: internal_error, status: 500 }, { code: snapshot_conflict, status: 503 }]
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected. Archived event payloads are read from the configured WORM archive and verified against the retained receipt hash before being returned.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ $ref: '#/components/parameters/eventId' }, { $ref: '#/components/parameters/tenantId' }]
      responses:
        '200': { description: 'Event', content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/events/{eventId}/receipt:
    get:
      operationId: getReceipt
      x-runtime-handler: getReceipt
      x-required-permission: audit:event:read
      x-error-mappings: [{ code: invalid_request, status: 400 }, { code: unauthorized, status: 401 }, { code: forbidden, status: 403 }, { code: not_found, status: 404 }, { code: conflict, status: 409 }, { code: occurred_at_out_of_range, status: 422 }, { code: schema_not_found, status: 422 }, { code: tenant_mismatch, status: 422 }, { code: quota_exceeded, status: 429 }, { code: internal_error, status: 500 }, { code: snapshot_conflict, status: 503 }]
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ $ref: '#/components/parameters/eventId' }, { $ref: '#/components/parameters/tenantId' }]
      responses:
        '200': { description: 'Receipt', content: { application/json: { schema: { $ref: '#/components/schemas/Receipt' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/events:batch:
    post:
      operationId: writeBatch
      x-runtime-handler: postBatch
      x-required-permission: audit:event:write
      x-error-mappings: [{ code: invalid_request, status: 400 }, { code: unauthorized, status: 401 }, { code: forbidden, status: 403 }, { code: not_found, status: 404 }, { code: conflict, status: 409 }, { code: occurred_at_out_of_range, status: 422 }, { code: schema_not_found, status: 422 }, { code: tenant_mismatch, status: 422 }, { code: quota_exceeded, status: 429 }, { code: internal_error, status: 500 }, { code: snapshot_conflict, status: 503 }]
      description: 'Tenant scope: body-selected write; every platform batch member must provide a non-empty Event.tenant_id, tenant credentials use the signed tenant, and selector failures are rejected before any member is ingested.'
      x-tenant-scope: { policy: scoped, selector: body, selector_path: 'events[*].tenant_id', platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [events], properties: { events: { type: array, maxItems: 500, description: 'An over-count batch is rejected before any member is ingested.', items: { $ref: '#/components/schemas/EventInput' } }, wait_for: { type: string } } } } } }
      responses:
        '202': { description: 'Accepted batch', content: { application/json: { schema: { $ref: '#/components/schemas/BatchReceiptResponse' } } } }
        '400': { description: 'Batch error', content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/Error' }, { $ref: '#/components/schemas/BatchPartialError' }] } } } }
        '401': { description: 'Batch error', content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/Error' }, { $ref: '#/components/schemas/BatchPartialError' }] } } } }
        '403': { description: 'Batch error', content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/Error' }, { $ref: '#/components/schemas/BatchPartialError' }] } } } }
        '404': { description: 'Batch error', content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/Error' }, { $ref: '#/components/schemas/BatchPartialError' }] } } } }
        '409': { description: 'Batch error', content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/Error' }, { $ref: '#/components/schemas/BatchPartialError' }] } } } }
        '422': { description: 'Batch error; 422 occurred_at_out_of_range identifies an occurred_at value outside the supported ledger horizon.', content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/Error' }, { $ref: '#/components/schemas/BatchPartialError' }] } } } }
        '429': { description: 'Batch error', content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/Error' }, { $ref: '#/components/schemas/BatchPartialError' }] } } } }
        '500': { description: 'Batch error', content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/Error' }, { $ref: '#/components/schemas/BatchPartialError' }] } } } }
        '503': { description: 'Batch error', content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/Error' }, { $ref: '#/components/schemas/BatchPartialError' }] } } } }
  /api/v1/operations/{operationId}:
