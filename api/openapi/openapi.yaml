        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/operations/{operationId}/timeline:
    get:
      operationId: getOperationTimeline
      x-runtime-handler: getOperationTimeline
      x-required-permission: audit:operation:read
      x-error-mappings: [{ code: invalid_request, status: 400 }, { code: unauthorized, status: 401 }, { code: forbidden, status: 403 }, { code: not_found, status: 404 }, { code: conflict, status: 409 }, { code: occurred_at_out_of_range, status: 422 }, { code: schema_not_found, status: 422 }, { code: tenant_mismatch, status: 422 }, { code: quota_exceeded, status: 429 }, { code: internal_error, status: 500 }, { code: snapshot_conflict, status: 503 }]
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected. Items are ordered by (occurred_at, sequence, event_id); next_cursor is bound to this operation and resumes after the last item; count is the total matching event count.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters:
        - { $ref: '#/components/parameters/operationId' }
        - { $ref: '#/components/parameters/tenantId' }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: page_size, in: query, schema: { type: integer, maximum: 1000, default: 100 } }
      responses:
        '200': { description: 'Operation timeline page', content: { application/json: { schema: { $ref: '#/components/schemas/QueryResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
