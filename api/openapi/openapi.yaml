    Error: { type: object, required: [error], description: 'Standard error envelope. code is one of invalid_request, unauthorized, forbidden, not_found, conflict, occurred_at_out_of_range, schema_not_found, tenant_mismatch, quota_exceeded, snapshot_conflict, store_timeout, client_cancelled, client_deadline_exceeded, internal_error. A 400 internal_error may surface when a raw body-decoding failure precedes error classification; message is redacted to internal server error on any 5xx. client_cancelled and client_deadline_exceeded are the caller-withdrawal class (HTTP 499): the caller disconnected or its own request deadline expired, so no answer reached it. Their message is a fixed string ("client cancelled the request" / "client request deadline exceeded") and never carries the wrapped cause (event id, archive key, endpoint). The class is deliberately excluded from audit_http_errors_total and from the availability error budget, and it is counted on audit_http_request_cancelled_total{reason}. It is declared on every operation for contract uniformity and is reachable on read/query and owner control-action paths. Ingest commits detach from the request context (context.WithoutCancel), so a withdrawn ingest still completes durably and is never answered with 499. An abandoned cancel/retry may already have committed; reconcile metadata before another command, never infer rollback. A retrying client must treat 499 as terminal for that attempt (it produced no response) and must not treat it as a 5xx retry signal. Most intermediaries synthesise their own 499 (or substitute a 504) rather than forwarding this one; the metric is the authoritative signal.', properties: { error: { type: object, required: [code, message, request_id], properties: { code: { type: string, description: 'Machine-readable classification code.' }, message: { type: string }, request_id: { type: string }, reason: { type: string, enum: [legal_hold], description: 'Optional stable denial reason; present for Legal Hold export blocks while code remains forbidden for compatibility.' }, hold_id: { type: string, description: 'Blocking Hold ID, scoped to the authenticated tenant.' } } } } }
