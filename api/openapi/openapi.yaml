openapi: 3.1.0
x-contract-version: 1
info:
  title: Snaplink Audit Governance API
  version: 0.1.0
  description: Multi-tenant audit ingestion, immutable ledger and governance API.
servers:
  - url: http://localhost:8089
security:
  - bearerAuth: []
paths:
  /api/v1/compat/snaplink/audit/events:
    get:
      operationId: querySnaplinkConsoleAuditEvents
      x-runtime-handler: querySnaplinkAuditEvents
      x-required-permission: audit:event:read
      x-allow-tenantless-console: true
      x-error-mappings: [{ code: invalid_request, status: 400 }, { code: unauthorized, status: 401 }, { code: forbidden, status: 403 }, { code: not_found, status: 404 }, { code: conflict, status: 409 }, { code: occurred_at_out_of_range, status: 422 }, { code: schema_not_found, status: 422 }, { code: tenant_mismatch, status: 422 }, { code: quota_exceeded, status: 429 }, { code: internal_error, status: 500 }, { code: snapshot_conflict, status: 503 }, { code: store_timeout, status: 503 }, { code: client_cancelled, status: 499 }, { code: client_deadline_exceeded, status: 499 }]
      description: 'Tenant scope: approved all-tenant Console read; omitted or empty tenant_id means all tenants, while a supplied filter narrows the result and signed tenant claims remain authoritative. All responses are Cache-Control no-store. The service captures an owned deep snapshot, then authenticates committed receipt/map identity, exact Schema identity/version, reconstructed content and chain outside Store locks before any query predicate. Missing/corrupt evidence fails closed without partial events/count/cursor or a successful read fact; hot-only/journal residue is not committed truth. Capture, source Get/authentication, sorting/pagination and one fail-closed read self-audit share the original single service operation deadline; captured state is never written back over concurrent control. Protected fields retain their stored format and search sidecars are stripped recursively from HTTP events; no sensitive filter URL is added. This remains newest-first live pagination, not fixed membership: count retains the legacy number matching after the cursor (all matches on the first page), and later calls may observe late/new commits. Historical materialization/authentication scans, ClickHouse facets and completeness remain separate work.'
      x-tenant-scope: { policy: all-tenants, selector: optional-query-filter, platform_selector_required: false, tenant_token_source: signed-claim, empty_platform_behavior: all-tenants }
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: event_type, in: query, schema: { type: string } }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: client_id, in: query, description: 'Trusted source_system filter', schema: { type: string } }
        - { $ref: '#/components/parameters/tenantId' }
        - { name: outcome, in: query, schema: { type: string } }
        - { name: trace_id, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { oneOf: [{ type: string, format: date-time }, { type: integer, format: int64 }] } }
        - { name: until, in: query, schema: { oneOf: [{ type: string, format: date-time }, { type: integer, format: int64 }] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        '200': { description: 'Newest-first Console event page', content: { application/json: { schema: { $ref: '#/components/schemas/AuditExplorerResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '499': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/compat/snaplink/audit/events/{eventId}:
    get:
      operationId: getSnaplinkConsoleAuditEvent
      x-runtime-handler: getEvent
      x-required-permission: audit:event:read
      x-error-mappings: [{ code: invalid_request, status: 400 }, { code: unauthorized, status: 401 }, { code: forbidden, status: 403 }, { code: not_found, status: 404 }, { code: conflict, status: 409 }, { code: occurred_at_out_of_range, status: 422 }, { code: schema_not_found, status: 422 }, { code: tenant_mismatch, status: 422 }, { code: quota_exceeded, status: 429 }, { code: internal_error, status: 500 }, { code: snapshot_conflict, status: 503 }, { code: store_timeout, status: 503 }, { code: client_cancelled, status: 499 }, { code: client_deadline_exceeded, status: 499 }]
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected. The same scoped GetEvent as the canonical route: all responses are no-store. Before source Get, the requested tenant/event must match the committed receipt body, not just its lookup key. Exact Schema body tenant/id/version is checked before reconstructed content/chain authentication outside Store locks; missing/misbound definitions fail conflict, never newest-version substitution, while disabled exact historical definitions remain readable. Capture/Get/authentication and one fail-closed read fact share the original deadline; even cancellation after durable append serves no event and never retracts the attempt fact. Protected values stay protected and HTTP strips search sidecars. No all-tenant detail fallback or completeness assertion.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ $ref: '#/components/parameters/eventId' }, { $ref: '#/components/parameters/tenantId' }]
      responses:
        '200': { description: 'Canonical governance event', content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '499': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/compat/snaplink/audit/facets:
    get:
      operationId: querySnaplinkConsoleAuditFacets
      x-runtime-handler: querySnaplinkAuditFacets
      x-required-permission: audit:event:read
      x-allow-tenantless-console: true
      x-error-mappings: [{ code: invalid_request, status: 400 }, { code: unauthorized, status: 401 }, { code: forbidden, status: 403 }, { code: not_found, status: 404 }, { code: conflict, status: 409 }, { code: occurred_at_out_of_range, status: 422 }, { code: schema_not_found, status: 422 }, { code: tenant_mismatch, status: 422 }, { code: quota_exceeded, status: 429 }, { code: internal_error, status: 500 }, { code: snapshot_conflict, status: 503 }, { code: store_timeout, status: 503 }, { code: client_cancelled, status: 499 }, { code: client_deadline_exceeded, status: 499 }]
      description: 'Tenant scope: approved all-tenant Console read; omitted or empty tenant_id means all tenants, while a supplied filter narrows the result and signed tenant claims remain authoritative. All responses are Cache-Control no-store. Like the Console event page, the service captures an owned deep snapshot and authenticates committed receipt/map identity, exact Schema identity/version, reconstructed content and chain outside Store locks before filtering or aggregation. Missing/corrupt evidence rejects the entire observation, never partial totals/categories or a successful read fact; hot-only/journal residue is not truth. Capture, source Get/authentication, aggregation and one fail-closed read self-audit share the original single service operation deadline; no stale snapshot is saved over concurrent control. Empty success retains empty maps. Facets ignore pagination inputs: total/categories cover all current filter matches; clients derive from trusted source_system and providers stays empty because no trusted counterpart exists. This is a live reference scan, not ClickHouse facets, fixed membership or completeness proof; historical materialization/authentication cost remains.'
      x-tenant-scope: { policy: all-tenants, selector: optional-query-filter, platform_selector_required: false, tenant_token_source: signed-claim, empty_platform_behavior: all-tenants }
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: event_type, in: query, schema: { type: string } }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: client_id, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/tenantId' }
        - { name: outcome, in: query, schema: { type: string } }
        - { name: trace_id, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { oneOf: [{ type: string, format: date-time }, { type: integer, format: int64 }] } }
        - { name: until, in: query, schema: { oneOf: [{ type: string, format: date-time }, { type: integer, format: int64 }] } }
      responses:
        '200': { description: 'Facet counts', content: { application/json: { schema: { $ref: '#/components/schemas/EventFacetsResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '499': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/events:
    post:
      operationId: writeEvent
      x-runtime-handler: postEvent
      x-required-permission: audit:event:write
      x-error-mappings: [{ code: invalid_request, status: 400 }, { code: unauthorized, status: 401 }, { code: forbidden, status: 403 }, { code: not_found, status: 404 }, { code: conflict, status: 409 }, { code: occurred_at_out_of_range, status: 422 }, { code: schema_not_found, status: 422 }, { code: tenant_mismatch, status: 422 }, { code: quota_exceeded, status: 429 }, { code: internal_error, status: 500 }, { code: snapshot_conflict, status: 503 }, { code: store_timeout, status: 503 }, { code: client_cancelled, status: 499 }, { code: client_deadline_exceeded, status: 499 }]
      x-tenant-scope: { policy: scoped, selector: body, selector_path: tenant_id, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      description: 'Tenant scope: body-selected write; platform credentials must provide a non-empty Event.tenant_id; tenant credentials use the signed tenant and reject a mismatch. The server derives OAuth client identity from signed client_id (or compatible azp). When no tenant claim exists, tenant_id is uniquely resolved from server-side (client_id, source_system) registration. A non-empty body stream_id is stripped on ingest; the server derives the stream from tenant + aggregate/operation/source and stamps it. stream_id is a read/query filter only. sub is never used as client identity. Runtime caps are authoritative: applicable persisted strings are limited to 8192 UTF-8 bytes, not characters.'
      parameters:
        - { name: wait_for, in: query, schema: { type: string, enum: [accepted, ledgered, indexed, archived] } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EventInput' } } } }
      responses:
        '202': { description: 'Accepted', content: { application/json: { schema: { $ref: '#/components/schemas/ReceiptResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error', description: 'Envelope validation failure; 422 occurred_at_out_of_range is returned when occurred_at is outside the supported ledger horizon.' }
        '429': { $ref: '#/components/responses/Error' }
        '499': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    get:
      operationId: queryEvents
      x-runtime-handler: queryEvents
      x-required-permission: audit:event:read
      x-error-mappings: [{ code: invalid_request, status: 400 }, { code: unauthorized, status: 401 }, { code: forbidden, status: 403 }, { code: not_found, status: 404 }, { code: conflict, status: 409 }, { code: occurred_at_out_of_range, status: 422 }, { code: schema_not_found, status: 422 }, { code: tenant_mismatch, status: 422 }, { code: quota_exceeded, status: 429 }, { code: internal_error, status: 500 }, { code: snapshot_conflict, status: 503 }, { code: store_timeout, status: 503 }, { code: client_cancelled, status: 499 }, { code: client_deadline_exceeded, status: 499 }]
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected. Items are ordered by (occurred_at, sequence, event_id). The first query fixes observed result membership for 15 minutes; count remains constant throughout that walk. Late occurrences or commits appear only in a fresh query. Authenticated cursors bind tenant, subject, filters and page size; altered, expired, unavailable or pre-snapshot cursors return 400 and require a fresh query, never a live fallback. At most 10000 matched identities and 16 active paginated snapshots per tenant; admission exhaustion returns 429. The ledger-reference first selection captures an owned deep snapshot and authenticates committed receipt/map identity, exact Schema identity/version, reconstructed content and chain outside Store locks before every query predicate. Missing/corrupt committed evidence fails the whole selection, never hidden or partial membership; hot-only/journal residue is not truth and missing indexed bodies are not skipped. Sensitive predicates derive from authenticated source values in the condition bound/legacy format, never saved sidecar presence/value/format; encrypted searchable first queries now support either condition format without replacing protected response values with plaintext. The unchanged 10000 limit counts matches, not source scans, and is not imposed on Console. Capture, Get/authentication/selection, membership Save and one fail-closed read fact share the original single query deadline; even post-append cancellation serves no result, without pretending committed attempt facts or runtime metadata were rolled back. Captured state is not saved over concurrent terminal/lease/Hold/control. Old saved memberships are not reselected. The reference first page still materializes/authenticates history; this is not a globally atomic transaction snapshot, a capacity assurance or a completeness assertion. Subsequent pages resolve only their selected coordinates and authenticate content against ledger receipts; missing or changed evidence fails closed. Selected-coordinate reads bind the requested tenant/event to receipt body identity before source Get and verify exact Schema body tenant/id/version before content/chain authentication; missing or misbound definitions fail conflict, never latest-version substitution, while disabled exact historical definitions remain readable. Continuation never reselects membership or scans the served prefix. Archived reads occur outside Store locks under one operation deadline. Responses use Cache-Control no-store. An explicitly configured ClickHouse index supplies deduplicated candidates and count; every coordinate is checked against committed ledger receipts and returned evidence comes from Ledger/WORM. Projection completeness is not asserted, failures do not silently fall back. Sensitive digest filters explicitly use the ledger adapter; clients should send filters using POST events:query rather than URL.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters:
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - { $ref: '#/components/parameters/tenantId' }
        - { name: event_type, in: query, schema: { type: string } }
        - { name: source_system, in: query, schema: { type: string } }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: target_id, in: query, schema: { type: string } }
        - { name: operation_id, in: query, schema: { type: string } }
        - { name: causation_id, in: query, schema: { type: string } }
        - { name: correlation_id, in: query, schema: { type: string } }
        - { name: aggregate_type, in: query, schema: { type: string } }
        - { name: aggregate_id, in: query, schema: { type: string } }
        - { name: trace_id, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string } }
        - { name: payload_field, in: query, schema: { type: string } }
        - { name: payload_digest, in: query, schema: { type: string } }
        - { name: stream_id, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: page_size, in: query, schema: { type: integer, maximum: 1000, default: 100 } }
      responses:
        '200': { description: 'Event page', content: { application/json: { schema: { $ref: '#/components/schemas/QueryResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '499': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/events:query:
    post:
      operationId: queryEventsBody
      x-runtime-handler: queryEvents
      x-required-permission: audit:event:read
      x-error-mappings: [{ code: invalid_request, status: 400 }, { code: unauthorized, status: 401 }, { code: forbidden, status: 403 }, { code: not_found, status: 404 }, { code: conflict, status: 409 }, { code: occurred_at_out_of_range, status: 422 }, { code: schema_not_found, status: 422 }, { code: tenant_mismatch, status: 422 }, { code: quota_exceeded, status: 429 }, { code: internal_error, status: 500 }, { code: snapshot_conflict, status: 503 }, { code: store_timeout, status: 503 }, { code: client_cancelled, status: 499 }, { code: client_deadline_exceeded, status: 499 }]
      description: 'Tenant-scoped event query with the same authorization, fixed membership, chronological order, bounds, evidence verification and self-audit as GET events. Platform credentials must select tenant_id; tenant credentials use the signed claim. The ledger-reference initial selection authenticates receipt/map identity, exact Schema identity/version, reconstructed content and chain outside Store locks before every predicate; corrupt/missing committed evidence never becomes hidden or partial membership. Sensitive conditions are recomputed from authenticated exact source values in their own bound/legacy format, including encrypted searchable fields; saved sidecar presence/value/format is not trusted and protected response fields are not replaced with plaintext. Capture through membership Save and one fail-closed audit append share the original query deadline, with zero result on late cancellation/unknown append and no rollback claim for durable attempt metadata/facts. Saved memberships, projection failure policy and quotas are unchanged. Coordinate reads for continuation and actual projection output pages additionally bind requested tenant/event to receipt body identity before source Get, and verify exact Schema body tenant/id/version before content/chain authentication. Missing or misbound definitions fail conflict, never latest-version substitution; disabled exact historical definitions remain readable. Continuation never reselects membership or scans the served prefix; historical materialization/authentication cost remains. Query filters and sensitive search digests travel in the JSON body, never URL or logs; tenant_id inside the body cannot override scope. Each cursor binds subject, tenant, filters and page size for 15 minutes; expired or incompatible cursors require restarting, never live fallback. Snapshot completeness is not asserted. Responses use Cache-Control no-store.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters:
        - { $ref: '#/components/parameters/tenantId' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Query' } } } }
      responses:
        '200': { description: 'Fixed event page', content: { application/json: { schema: { $ref: '#/components/schemas/QueryResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '499': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/events/{eventId}:
    get:
      operationId: getEvent
      x-runtime-handler: getEvent
      x-required-permission: audit:event:read
      x-error-mappings: [{ code: invalid_request, status: 400 }, { code: unauthorized, status: 401 }, { code: forbidden, status: 403 }, { code: not_found, status: 404 }, { code: conflict, status: 409 }, { code: occurred_at_out_of_range, status: 422 }, { code: schema_not_found, status: 422 }, { code: tenant_mismatch, status: 422 }, { code: quota_exceeded, status: 429 }, { code: internal_error, status: 500 }, { code: snapshot_conflict, status: 503 }, { code: store_timeout, status: 503 }, { code: client_cancelled, status: 499 }, { code: client_deadline_exceeded, status: 499 }]
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected. All responses are Cache-Control no-store. Before any source Get, the requested tenant/event must match the committed receipt body, not just its lookup key. Archived event payloads are read from the configured WORM archive; outside Store locks the exact Schema body tenant/id/version, reconstructed content and receipt/chain binding are authenticated. Missing or misbound exact definitions fail conflict, never newest-version substitution; disabled historical exact definitions remain readable. Protected fields are not replaced by internal plaintext and HTTP strips search sidecars. Capture, Get/authentication and one fail-closed read fact share the original service deadline, including a final cancellation/deadline check after append. A durable but unknown or subsequently cancelled attempt fact is not retracted and proves no bytes delivered; no event is served on failure/withdrawal. Captured state never overwrites concurrent terminal/lease/Hold/control. This remains a scoped selected-coordinate read, not an all-tenant fallback or completeness proof.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ $ref: '#/components/parameters/eventId' }, { $ref: '#/components/parameters/tenantId' }]
      responses:
        '200': { description: 'Event', content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '499': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/events/{eventId}/receipt:
    get:
      operationId: getReceipt
      x-runtime-handler: getReceipt
      x-required-permission: audit:event:read
      x-error-mappings: [{ code: invalid_request, status: 400 }, { code: unauthorized, status: 401 }, { code: forbidden, status: 403 }, { code: not_found, status: 404 }, { code: conflict, status: 409 }, { code: occurred_at_out_of_range, status: 422 }, { code: schema_not_found, status: 422 }, { code: tenant_mismatch, status: 422 }, { code: quota_exceeded, status: 429 }, { code: internal_error, status: 500 }, { code: snapshot_conflict, status: 503 }, { code: store_timeout, status: 503 }, { code: client_cancelled, status: 499 }, { code: client_deadline_exceeded, status: 499 }]
      description: 'Tenant scope: scoped read; tenant credentials use the signed tenant and platform credentials must supply a non-empty tenant_id query selector. Omitted or empty platform scope is rejected. All responses are Cache-Control no-store. The requested tenant/event must match the committed receipt body, not just its lookup key; misbinding fails with fixed conflict and no receipt or successful read fact. V2 uses the existing exact tenant cold receipt index rather than materializing unrelated cold history; legacy v1 still materializes its snapshot and tenant hot/control cloning costs remain. Metadata lookup and one fail-closed read self-audit share the original service operation deadline, with context checks after capture and durable append. Failed, timed-out or withdrawn reads serve no receipt; an already-durable attempt fact is not retracted and proves no byte delivery. Stored status/times/coordinates/diagnostics are preserved, never upgraded or inferred. No source Get or Schema/content/full-chain authentication is performed: a receipt is not broker/ClickHouse confirmation, proof of current archive availability, completeness, business execution or evidence-download authorization. Captured metadata is not saved over concurrent terminal/lease/Hold/control.'
      x-tenant-scope: { policy: scoped, selector: query, platform_selector_required: true, tenant_token_source: signed-claim, empty_platform_behavior: reject }
      parameters: [{ $ref: '#/components/parameters/eventId' }, { $ref: '#/components/parameters/tenantId' }]
      responses:
        '200': { description: 'Receipt', content: { application/json: { schema: { $ref: '#/components/schemas/Receipt' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '499': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/events:batch:
    post:
      operationId: writeBatch
      x-runtime-handler: postBatch
      x-required-permission: audit:event:write
