syntax = "proto3";

package snaplink.audit.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/snaplink/audit-governance/api/proto;auditv1";

message Actor {
  string id = 1;
  string type = 2;
  string name = 3;
  string department = 4;
  repeated string roles = 5;
}

message Target {
  string type = 1;
  string id = 2;
  string name = 3;
}

message FieldChange {
  string field = 1;
  string before_json = 2;
  string after_json = 3;
}

message EventEnvelope {
  string event_id = 1;
  // The server authorizes this value against the signed OAuth client_id (or
  // compatible azp). The subject claim is never treated as client identity.
  string source_system = 2;
  string event_type = 3;
  string schema_id = 4;
  int32 schema_version = 5;
  google.protobuf.Timestamp occurred_at = 6;
  string operation_id = 7;
  string causation_id = 8;
  string correlation_id = 9;
  string trace_id = 10;
  string span_id = 11;
  Actor actor = 12;
  repeated Target targets = 13;
  string aggregate_type = 14;
  string aggregate_id = 15;
  int64 aggregate_version = 16;
  string action = 17;
  string outcome = 18;
  string reason = 19;
  repeated FieldChange changed_fields = 20;
  bytes payload_json = 21;
  string payload_ref = 22;
  string data_classification = 23;
  string retention_class = 24;
  string idempotency_key = 25;
  string workflow_instance_id = 26;
  string execution_run_id = 27;
}

message WriteRequest {
  EventEnvelope event = 1;
  string wait_for = 2;
}

message WriteResponse {
  string event_id = 1;
  string tenant_id = 2;
  string status = 3;
  // Read-only receipt field: the ledger stream is server-derived
  // (tenant + aggregate/operation/source) and stamped on ingest. The ingest
  // envelope (EventEnvelope) intentionally carries no stream_id — a
  // client-supplied value is stripped by Service.Ingest (stream
  // consistency), so any future envelope field must NOT be mapped.
  string stream_id = 4;
  int64 sequence = 5;
  string hash = 6;
  bool duplicate = 7;
}

message WriteBatchRequest {
  repeated EventEnvelope events = 1;
  string wait_for = 2;
}

message WriteBatchResponse {
  repeated WriteResponse receipts = 1;
}

service Ingest {
  // Supported inbound for the audit ingest surface (B1-6): Write,
  // WriteBatch and WriteStream are production-supported and share the HTTP
  // path's constraints — bearer-token authentication (same Authenticator),
  // server-side tenant resolution with envelope-tenant consistency (DS-08,
  // mismatch -> FailedPrecondition/422), schema validation, idempotency and
  // service-layer self-audit. Tenant identity is resolved from signed token
  // claims or the unique server-side (client_id, source_system)
  // registration, never request data.
  rpc Write(WriteRequest) returns (WriteResponse);
  rpc WriteBatch(WriteBatchRequest) returns (WriteBatchResponse);
  rpc WriteStream(stream WriteRequest) returns (stream WriteResponse);
}
