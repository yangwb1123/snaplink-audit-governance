asyncapi: 3.0.0
info:
  title: Snaplink Audit Governance Events
  version: 1.0.0
  description: Normalized audit event lifecycle topics.
defaultContentType: application/json
channels:
  accepted:
    address: audit.events.accepted.v1
    description: >-
      Accepted, normalized audit events. Producers MUST set the Kafka message
      key to the payload's canonical event_id; the replay recovery path also
      matches by payload event_id, so an absent or mismatched key never blocks
      recovery, but key alignment keeps dead-letter evidence and partitioning
      correct.
    messages:
      auditEvent:
        $ref: '#/components/messages/AcceptedEvent'
        bindings:
          kafka:
            key:
              type: string
              description: MUST equal the AcceptedEvent payload's event_id.
  ledgered:
    address: audit.events.ledgered.v1
    description: >-
      Post-ledger, chain-linked audit events. Published after the immutable
      ledger commit; stream_id, sequence, prev_hash and hash are server-assigned
      and present on this channel. The Kafka message key MUST equal event_id.
    messages:
      auditEvent:
        $ref: '#/components/messages/LedgeredEvent'
        bindings:
          kafka:
            key:
              type: string
              description: MUST equal the LedgeredEvent payload's event_id.
  dlq:
    address: audit.events.dlq.v1
    messages:
      failure:
        $ref: '#/components/messages/Failure'
        bindings:
          kafka:
            key:
              type: string
              description: MUST equal the Failure payload's event_id.
operations:
  publishAccepted:
    action: send
    channel:
      $ref: '#/channels/accepted'
  publishLedgered:
    action: send
    channel:
      $ref: '#/channels/ledgered'
  publishFailure:
    action: send
    channel:
      $ref: '#/channels/dlq'
components:
  messages:
    # Deprecated compatibility alias. It is intentionally not referenced by
    # an active channel or operation and may be removed after one release.
    AuditEvent:
      deprecated: true
      payload:
        $ref: '#/components/schemas/EventEnvelope'
    AcceptedEvent:
      payload:
        $ref: '#/components/schemas/AcceptedEvent'
    LedgeredEvent:
      payload:
        $ref: '#/components/schemas/LedgeredEvent'
    Failure:
      description: >-
        Replay consumers require one complete JSON object containing exactly
        one JSON value. Trailing whitespace is allowed; non-whitespace
        trailing data and multiple JSON values are rejected.
      payload:
        type: object
        required: [event_id, error_code, error_message]
        properties:
          event_id: { type: string, minLength: 1 }
          error_code: { type: string }
          error_message: { type: string }
          # Tenant CLAIMED by the failing event's envelope at dead-letter time
          # (the decoded envelope value, NOT server-verified — the ingest
          # API's server-resolved tenant is the only authorization authority;
          # consumers must use this field for display/filtering only). Empty
          # when the payload was unparsable; absent on records written by
          # older producers.
          tenant_id: { type: string }
  schemas:
    AcceptedEvent:
      allOf: [{ $ref: '#/components/schemas/EventEnvelope' }]
    LedgeredEvent:
      allOf: [{ $ref: '#/components/schemas/EventEnvelope' }, { type: object, description: 'stream_id, sequence, prev_hash, and hash are server-assigned ledger state. stream_id is non-empty and sequence is at least 1 on this channel. hash is non-empty. prev_hash may be empty or omitted only for the first event in a stream and is non-empty for subsequent service-produced events.', required: [stream_id, sequence, hash], properties: { stream_id: { type: string, minLength: 1, description: 'Server-assigned; client value is stripped on ingest.' }, sequence: { type: integer, minimum: 1 }, prev_hash: { type: string }, hash: { type: string, minLength: 1 } } }]
    IngestBatch:
      type: object
      description: >-
        HTTP and gRPC ingest batches accept at most 500 events. The runtime
        rejects a larger batch before converting or ingesting any member.
      required: [events]
      properties:
        events:
          type: array
          maxItems: 500
          description: Maximum number of events in one ingest batch. This is a fixed runtime resource cap.
          items:
            $ref: '#/components/schemas/EventEnvelope'
        wait_for: { type: string }
    EventEnvelope:
      type: object
      required: [event_id, source_system, event_type, schema_id, schema_version, occurred_at, actor, action, outcome, data_classification, retention_class, idempotency_key]
      description: >-
        Runtime caps on persisted envelope strings are measured in UTF-8
        bytes, not characters. The schema maxLength markers document the
        fixed limit; runtime validation is authoritative.
      properties:
        event_id: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }
        tenant_id: { type: string }
        source_system: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }
        event_type: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }
        schema_id: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }
        schema_version: { type: integer, minimum: 1 }
        occurred_at: { type: string, format: date-time, description: 'Business occurrence time, UTC. Must be within [1900-01-01T00:00:00Z, 2299-12-31T23:59:59.999Z] (ClickHouse DateTime64 projection range); out-of-range values are rejected 422 occurred_at_out_of_range at ingest.' }
        received_at: { type: string, format: date-time }
        operation_id: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }
        causation_id: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }
        correlation_id: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }
        trace_id: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }
        span_id: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }
        actor: { type: object, required: [id], properties: { id: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }, type: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }, name: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }, department: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }, roles: { type: array, maxItems: 64, description: 'At most 64 role entries; each role is capped at 8192 UTF-8 bytes at runtime.', items: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' } } } }
        targets:
          type: array
          maxItems: 64
          description: 'At most 64 targets; applicable target strings are capped at 8192 UTF-8 bytes at runtime.'
          items:
            type: object
            properties:
              type: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }
              id: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }
              name: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }
        aggregate_type: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }
        aggregate_id: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }
        aggregate_version: { type: integer }
        workflow_instance_id: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }
        execution_run_id: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }
        action: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }
        outcome: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }
        reason: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }
        changed_fields:
          type: object
          maxProperties: 256
          description: 'At most 256 changed-field entries. Keys are capped at 8192 UTF-8 bytes; before and after values are capped at 8192 bytes after canonical JSON serialization.'
          propertyNames:
            maxLength: 8192
            description: 'Runtime limit is 8192 UTF-8 bytes, not characters.'
          additionalProperties:
            type: object
            properties:
              before:
                maxLength: 8192
                description: Canonical JSON serialization is capped at 8192 UTF-8 bytes at runtime.
                x-maxCanonicalJsonBytes: 8192
              after:
                maxLength: 8192
                description: Canonical JSON serialization is capped at 8192 UTF-8 bytes at runtime.
                x-maxCanonicalJsonBytes: 8192
        payload: { type: object, additionalProperties: true }
        payload_ref: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }
        data_classification: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }
        retention_class: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }
        idempotency_key: { type: string, maxLength: 8192, description: 'Runtime limit is 8192 UTF-8 bytes, not characters.' }
        stream_id: { type: string, description: Server-assigned; a client-supplied value is stripped on ingest. }
        sequence: { type: integer, description: Server-assigned sequence within the ledger stream; always >= 1 on the ledgered channel. }
        prev_hash: { type: string, description: Server-assigned predecessor hash in the ledger chain; empty only for the first event of a stream. }
        hash: { type: string, description: Server-assigned chain hash; always non-empty on the ledgered channel. }
      anyOf: [{ required: [payload] }, { required: [payload_ref] }]
