asyncapi: 3.0.0
info:
  title: Snaplink Audit Governance Events
  version: 1.0.0
  description: Normalized audit event lifecycle topics.
defaultContentType: application/json
channels:
  accepted:
    address: audit.events.accepted.v1
    description: >-
      Accepted, normalized audit events. Producers MUST set the Kafka message
      key to the payload's canonical event_id; the replay recovery path also
      matches by payload event_id, so an absent or mismatched key never blocks
      recovery, but key alignment keeps dead-letter evidence and partitioning
      correct.
    messages:
      auditEvent:
        $ref: '#/components/messages/AuditEvent'
        bindings:
          kafka:
            key:
              type: string
              description: MUST equal the AuditEvent payload's event_id.
  ledgered:
    address: audit.events.ledgered.v1
    description: >-
      Post-ledger, chain-linked audit events. Published after the immutable
      ledger commit; stream_id, sequence, prev_hash and hash are server-assigned
      and present on this channel. The Kafka message key MUST equal event_id.
    messages:
      auditEvent:
        $ref: '#/components/messages/AuditEvent'
  projection:
    address: audit.events.projection.v1
    messages:
      auditEvent:
        $ref: '#/components/messages/AuditEvent'
  archive:
    address: audit.events.archive.v1
    messages:
      auditEvent:
        $ref: '#/components/messages/AuditEvent'
  dlq:
    address: audit.events.dlq.v1
    messages:
      failure:
        $ref: '#/components/messages/Failure'
operations:
  publishAccepted:
    action: send
    channel:
      $ref: '#/channels/accepted'
  publishLedgered:
    action: send
    channel:
      $ref: '#/channels/ledgered'
  publishProjection:
    action: send
    channel:
      $ref: '#/channels/projection'
  publishArchive:
    action: send
    channel:
      $ref: '#/channels/archive'
  publishFailure:
    action: send
    channel:
      $ref: '#/channels/dlq'
components:
  messages:
    AuditEvent:
      payload:
        $ref: '#/components/schemas/EventEnvelope'
    Failure:
      payload:
        type: object
        required: [event_id, error_code, error_message]
        properties:
          event_id: { type: string, minLength: 1 }
          error_code: { type: string }
          error_message: { type: string }
          # Tenant CLAIMED by the failing event's envelope at dead-letter time
          # (the decoded envelope value, NOT server-verified — the ingest
          # API's server-resolved tenant is the only authorization authority;
          # consumers must use this field for display/filtering only). Empty
          # when the payload was unparsable; absent on records written by
          # older producers.
          tenant_id: { type: string }
  schemas:
    EventEnvelope:
      type: object
      required: [event_id, source_system, event_type, schema_id, schema_version, occurred_at, actor, action, outcome, data_classification, retention_class, idempotency_key]
      properties:
        event_id: { type: string }
        tenant_id: { type: string }
        source_system: { type: string }
        event_type: { type: string }
        schema_id: { type: string }
        schema_version: { type: integer, minimum: 1 }
        occurred_at: { type: string, format: date-time, description: 'Business occurrence time, UTC. Must be within [1900-01-01T00:00:00Z, 2299-12-31T23:59:59.999Z] (ClickHouse DateTime64 projection range); out-of-range values are rejected 422 occurred_at_out_of_range at ingest.' }
        received_at: { type: string, format: date-time }
        operation_id: { type: string }
        causation_id: { type: string }
        correlation_id: { type: string }
        trace_id: { type: string }
        span_id: { type: string }
        actor: { type: object, required: [id], properties: { id: { type: string } } }
        targets: { type: array, items: { type: object } }
        aggregate_type: { type: string }
        aggregate_id: { type: string }
        aggregate_version: { type: integer }
        workflow_instance_id: { type: string }
        execution_run_id: { type: string }
        action: { type: string }
        outcome: { type: string }
        reason: { type: string }
        changed_fields: { type: object }
        payload: { type: object, additionalProperties: true }
        payload_ref: { type: string }
        data_classification: { type: string }
        retention_class: { type: string }
        idempotency_key: { type: string }
        stream_id: { type: string, description: Server-assigned; a client-supplied value is stripped on ingest. }
        sequence: { type: integer, description: Server-assigned sequence within the ledger stream; always >= 1 on the ledgered channel. }
        prev_hash: { type: string, description: Server-assigned predecessor hash in the ledger chain; empty only for the first event of a stream. }
        hash: { type: string, description: Server-assigned chain hash; always non-empty on the ledgered channel. }
      anyOf: [{ required: [payload] }, { required: [payload_ref] }]
