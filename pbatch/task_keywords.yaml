# Bilingual keyword map for the task type classifier (pbatch/classifier.py).
# Mirrors role_keywords.yaml: CJK terms use substring matching, Latin terms
# use word boundaries; each hit scores 2 points, capped at 10 per type.
#
# The classifier runs BEFORE execution (--classify / `classify` subcommand)
# and routes frontend UI tasks to the configured UI generation pipeline.
# Edit/extend here instead of touching code; malformed YAML falls back to
# the built-in defaults in classifier.py.

task_types:
  # Frontend UI work: pages, components, layout, spacing, styling. A match
  # routes the batch to classifier.frontend_pipeline (ui-generation).
